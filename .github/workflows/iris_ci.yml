# Name displayed in the GitHub Actions tab
name: Iris ML API - CI Pipeline - CSE

# Define when GitHub Actions should run this workflow
on:
  # Run CI whenever code is pushed to the main branch
  push:
    branches:
      - main

  # Run CI whenever a pull request targets the main branch
  pull_request:
    branches:
      - main

  # Allow manually triggering the workflow from GitHub's Actions tab
  workflow_dispatch:

# Restrict the workflow's repository permissions
permissions:
  contents: read
  packages: write

jobs:
  # Define a job that tests the application and builds its Docker image
  test:
    name: Run API test

    # GitHub provides a fresh Ubuntu virtual machine for this job
    runs-on: ubuntu-latest

    # Run shell commands from the MLOPS-1 project directory
    # This is necessary because the application files are inside MLOPS-1/
    defaults:
      run:
        working-directory: MLOPS-1

    steps:
      # Step 1: Download the repository contents onto the GitHub runner
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Install the specified Python version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

          # Cache pip packages to speed up future workflow runs
          cache: pip

          # Specify where the dependency file is located
          cache-dependency-path: MLOPS-1/requirements.txt

      # Step 3: Install the project's Python dependencies
      - name: Install Python dependencies
        run: |
          # Upgrade pip to a recent version
          python -m pip install --upgrade pip

          # Install dependencies required by the application
          pip install -r requirements.txt

      # Step 4: Execute the automated tests inside the test directory
      - name: Run automated tests
        run: python -m pytest -v test/
    
  build-and-publish:
    name: Build and Publish Docker Image
    needs: test
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw, value=latest
            type=sha, format=short
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}